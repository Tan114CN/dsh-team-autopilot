name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Everything below is deliberately runnable without the DSH host: the
      # pure core (`select.ts` / `breaker.ts` / `stall.ts` / `observe.ts` /
      # `budget.ts`) has no runtime imports, and `dispatch.ts` never imports
      # `dsh-tools`. The host is simulated by a stub in `tests/integration.ts`.
      #
      # `scripts/verify-mount.mjs` is not run here: it needs a real DSH profile
      # directory on disk (it resolves a profile by name), so it stays an
      # operator-run check.

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: node tests/verify.ts

      - run: node tests/integration.ts

      - run: node scripts/acceptance.mjs

      # Validates the status tool's output schema against the real
      # dsh-tools compiler; a schema the host rejects fails silently at
      # runtime, so this is the only guard that catches it.
      - run: node scripts/verify-status.mjs

      - run: node scripts/verify-pack.mjs
